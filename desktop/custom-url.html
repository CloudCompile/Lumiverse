<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumiverse Instance</title>
  </head>
  <body>
    <main class="dialog">
      <header class="dialog-header">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <p class="eyebrow">Lumiverse Desktop</p>
          <h1>Instance connection</h1>
          <p class="intro">Choose where this desktop app opens Lumiverse.</p>
        </div>
      </header>

      <form id="frontend-url-form" novalidate>
        <fieldset>
          <legend>Connect using</legend>
          <div class="connection-options">
            <label class="connection-option" for="connection-mode-local" data-connection-option="local" data-selected>
              <input id="connection-mode-local" type="radio" name="connection-mode" value="local" checked />
              <span class="option-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              </span>
              <span class="option-copy">
                <span class="option-heading">
                  <strong>Local server</strong>
                  <span class="current-badge" hidden>Current</span>
                </span>
                <small>Use the Lumiverse server running on this computer.</small>
              </span>
              <span class="radio-mark" aria-hidden="true"></span>
            </label>

            <label class="connection-option" for="connection-mode-remote" data-connection-option="remote">
              <input id="connection-mode-remote" type="radio" name="connection-mode" value="remote" />
              <span class="option-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .8-7.9A6 6 0 0 0 6.4 8.5 4.8 4.8 0 0 0 7 18Z"/></svg>
              </span>
              <span class="option-copy">
                <span class="option-heading">
                  <strong>Remote instance</strong>
                  <span class="current-badge" hidden>Current</span>
                </span>
                <small>Connect to a cloud or self-hosted Lumiverse instance.</small>
              </span>
              <span class="radio-mark" aria-hidden="true"></span>
            </label>
          </div>
        </fieldset>

        <section id="remote-settings" class="remote-settings" aria-labelledby="remote-url-label" data-disabled="true">
          <div class="field-heading">
            <label id="remote-url-label" for="frontend-url">Instance URL</label>
            <span>HTTPS required</span>
          </div>
          <div class="input-shell">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>
            <input id="frontend-url" name="frontend-url" type="url" inputmode="url" placeholder="https://app.example.com" autocomplete="url" spellcheck="false" disabled />
          </div>
          <p class="field-hint">You’ll sign in securely in your system browser after saving.</p>
        </section>

        <p id="error" class="error" role="alert" aria-live="polite" hidden></p>

        <footer class="actions">
          <button id="cancel" class="button button-secondary" type="button">Cancel</button>
          <button id="save" class="button button-primary" type="submit">Save connection</button>
        </footer>
      </form>
    </main>
    <script type="module" src="/src/custom-url.ts"></script>
  </body>
</html>
