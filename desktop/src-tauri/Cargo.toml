[package]
name = "lumiverse-tray"
version = "0.3.0"
description = "Experimental Tauri-powered Lumiverse integrated browser and tray"
edition = "2021"
license-file = "../../LICENSE.md"

[lib]
name = "lumiverse_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
notify-rust = "4.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSString", "std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKPreferences", "WKWebViewConfiguration", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri/Wry does not expose Wayland background effects yet. Bind the staging
# protocol against GTK's existing display/surface handles until that support
# lands upstream.
gtk = "0.18"
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
