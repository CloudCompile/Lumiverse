<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Lumiverse</title>
  <link rel="stylesheet" href="connection.css">
  <script src="connection.js" defer></script>
</head>
<body>
  <main>
    <img src="icon.svg" width="88" height="88" alt="Lumiverse">
    <h1>Connect to Lumiverse</h1>
    <p>Enter your server address, then sign in with your Lumiverse account.</p>
    <form id="connection-form">
      <label for="server">Server address</label>
      <input id="server" name="server" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://lumiverse.example.com" required>
      <button id="connect" type="submit">Connect</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="detail">Your conversations and media stay on your server. This device remembers its address and your sign-in session.</p>
    <p class="detail">Touch and hold the screen with two fingers to open app controls.</p>
  </main>
</body>
</html>
