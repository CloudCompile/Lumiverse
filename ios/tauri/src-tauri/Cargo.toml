[package]
name = "lumiverse-ios-client"
version = "0.3.1"
edition = "2021"
license-file = "../../../LICENSE.md"

[lib]
name = "lumiverse_ios_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
experimental-high-refresh = ["tauri-plugin-lumiverse-ios/experimental-high-refresh"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-lumiverse-ios = { path = "../../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Xcode 27 requires SwiftPM's --triple cross-compilation path.
swift-rs = "=1.0.9"

[patch.crates-io]
# Tao 0.35.3 plus upstream PR #1245's scene configuration lifetime fix.
# This pinned revision differs from the official tag in one function only.
tao = { git = "https://github.com/Argos-Dynamics/tao", rev = "922fcb77892e90734181883722d1b1e9056062f1" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[profile.dev]
debug = 0
