[package]
name = "lumiverse-mobile"
version = "0.3.5"
edition = "2021"
license-file = "../../../LICENSE.md"

[lib]
name = "lumiverse_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[profile.dev]
debug = 0
