<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumiverse</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#14131d;color:#eeeaf8}*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px}main{width:min(100%,400px)}h1{font-size:2rem;margin:0 0 12px}p{line-height:1.5;color:#c1bacf}label{display:block;margin-top:20px}input,button{width:100%;padding:14px;border-radius:10px;font:inherit;color:inherit;border:1px solid #615574;margin-top:8px;background:#211f2e}button{margin-top:24px;background:#604481;cursor:pointer}button:disabled{opacity:.5}small{display:block;margin-top:8px;color:#aaa0bb;line-height:1.5}#error{color:#ffa8b2;overflow-wrap:anywhere}[hidden]{display:none!important}
</style></head><body><main>
<h1>Lumiverse</h1><p id="status" role="status">Opening Lumiverse…</p>
<form id="setup" hidden>
<p>Welcome. Create your local account to get started.</p>
<label for="username">Username</label><input id="username" name="username" autocomplete="username" pattern="[A-Za-z0-9_.]{3,32}" minlength="3" maxlength="32" required autocapitalize="none" spellcheck="false">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
<label for="storage">Temporary extension storage (MiB)</label><input id="storage" name="extensionStorageMiB" type="number" min="1" step="1" value="500" required aria-describedby="storage-help">
<small id="storage-help">Space extensions can use for temporary files. You can change this later in Settings → Extension Pools.</small>
<button id="start" type="submit">Start Lumiverse</button>
</form><p id="error" role="alert"></p><button id="retry" hidden>Try again</button>
</main><script>
const key='lumiverse-android-token';const token=location.hash.slice(1)||sessionStorage.getItem(key)||'';
if(token)sessionStorage.setItem(key,token);history.replaceState(null,'',location.pathname);
const el=id=>document.getElementById(id);let submitting=false;let refreshing=false;
async function api(path,body){const response=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'x-lumiverse-prototype':token,'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
async function refresh(){if(refreshing)return;refreshing=true;try{const current=await api('status');if(current.backendUrl){location.replace(current.backendUrl);return}el('setup').hidden=current.configured;el('status').hidden=!current.configured;el('status').textContent='Opening Lumiverse…';el('retry').hidden=!current.configured||['starting','running'].includes(current.backendState);if(current.backendError){el('status').textContent='Lumiverse couldn’t start.';el('error').textContent=current.backendError}}catch(error){el('error').textContent=error.message}finally{refreshing=false}}
async function start(body){submitting=true;el('start').disabled=true;el('retry').disabled=true;el('error').textContent='';try{await api('backend/start',body);el('password').value=''}catch(error){el('error').textContent=error.message}finally{submitting=false;el('start').disabled=false;el('retry').disabled=false;await refresh()}}
el('setup').onsubmit=event=>{event.preventDefault();if(!submitting)void start(Object.fromEntries(new FormData(event.target)))};
el('retry').onclick=()=>{if(!submitting)void start({})};
void refresh();setInterval(refresh,500);
</script></body></html>
